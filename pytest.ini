[pytest]
# Folder where pytest looks for test files
testpaths = tests

# The website under test. Lets page objects call page.goto("/") instead of the full URL
base_url = https://mb.io

# -v                   show each test name with PASSED / FAILED
# -rxX                 list known bugs (xfail) and fixed bugs (xpass) at the end
# --tracing            keep a step-by-step trace of every failed test (open with: playwright show-trace)
# --html               write an HTML report (screenshots are added by conftest.py)
addopts =
    -v
    -rxX
    --tracing retain-on-failure
    --html=reports/report.html
    --self-contained-html